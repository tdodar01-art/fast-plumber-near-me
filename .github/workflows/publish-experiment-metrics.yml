name: Publish Experiment Metrics

on:
  schedule:
    # 7:30 AM CT daily. Re-enabled 2026-06-04 to collect daily metrics for
    # exp-003 (SERP title/description CTR test, runs through 2026-07-04).
    # Re-disable after exp-003 closes unless another active experiment needs it.
    - cron: "30 12 * * *"
  workflow_dispatch: # Manual trigger also available

concurrency:
  group: experiment-metrics
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/plumbers-web

jobs:
  publish-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Check Firebase secret
        id: firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "WARNING: FIREBASE_SERVICE_ACCOUNT secret not set"
          fi

      - name: Setup service account
        if: steps.firebase.outputs.configured == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        # publishMetrics.ts reads apps/service-account.json (one level up from
        # apps/plumbers-web, which is this job's working-directory).
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > ../service-account.json

      - name: Install dependencies
        working-directory: .
        run: pnpm install --filter plumbers-web --frozen-lockfile

      - name: Publish experiment metrics
        if: steps.firebase.outputs.configured == 'true'
        env:
          GSC_SITE_URL: https://www.fastplumbernearme.com/
        run: npx tsx scripts/experiments/publish-metrics-cron.ts

      - name: Cleanup
        if: always()
        run: rm -f ../service-account.json
